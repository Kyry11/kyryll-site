name: Deploy

# Replaces the original workflow, which was deleted because it hard-coded a
# Cloudflare API token in plain text and invoked wrangler against a
# wrangler.toml that did not exist. Every secret here comes from GitHub
# encrypted secrets — never inline.

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy

    # Lifted to env so it can be tested in `if:` without interpolating the
    # secret into a shell command.
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}

    steps:
      # Actions are pinned to commit SHAs, not floating tags. A tag can be
      # repointed by whoever owns the action, and one of these is handed the
      # deployment token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Do not leave a usable credential in .git/config for later steps.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: faithful/package-lock.json

      - name: Install
        working-directory: faithful
        run: npm ci

      - name: Typecheck and build
        working-directory: faithful
        run: npm run build

      # The build and typecheck above are the part worth running on every PR.
      # Deployment needs a resource that may not exist yet, so it is skipped
      # rather than failed when the token is absent — a red check that only
      # ever means "Azure is not provisioned" trains everyone to ignore red
      # checks.
      - name: Note that deployment was skipped
        if: env.SWA_TOKEN == ''
        run: |
          echo "::notice::AZURE_STATIC_WEB_APPS_API_TOKEN is not set — built and typechecked, but not deployed."

      # On master it is not optional. Merging with no deployment configured
      # should be loud, or the site silently stops being updated.
      - name: Require the deployment token on master
        if: github.ref == 'refs/heads/master' && env.SWA_TOKEN == ''
        run: |
          echo "::error::AZURE_STATIC_WEB_APPS_API_TOKEN is missing. master cannot deploy."
          exit 1

      # Deploys the built site plus the managed functions in api/.
      # A pull request gets its own preview URL automatically.
      - name: Deploy to Azure Static Web Apps
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: faithful/dist
          api_location: api
          output_location: ''
          skip_app_build: true

  close-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Tear down preview

    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}

    steps:
      # Nothing to tear down if nothing was ever deployed.
      - name: Close staging environment
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
